openapi: 3.0.3
info:
  version: '1.0'
  title: Fast Food Tech Challenge - Sistema de Gestão
  description: 'API para o sistema de autoatendimento de uma rede de fast food.

    Este projeto gerencia clientes, produtos, pedidos e pagamentos, seguindo as melhores
    práticas de arquitetura de software.

    '
  termsOfService: ''
  license:
    url: https://opensource.org/licenses/MIT
    name: MIT License
servers:
  - url: http://localhost:8080
    description: Localhost
paths:
  /orders:
    get:
      tags:
        - Order
      summary: Listar pedidos ativos
      description: 'Retorna uma lista paginada de pedidos que não estão com status
        `FINALIZED`.

        A lista é ordenada pela seguinte prioridade de status: `DONE` > `IN_PREPARATION`
        > `RECEIVED`.

        Dentro de cada status, os pedidos são ordenados do mais antigo para o mais
        novo.'
      operationId: get-orders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          $ref: '#/components/responses/OrderListResponse'
        '204':
          description: Nenhum pedido ativo encontrado
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
      servers:
        - url: http://localhost:8080
          description: Localhost
    post:
      tags:
        - Order
      summary: Criar um novo pedido
      description: 'Registra um novo pedido no sistema.


        **Dados necessários:**

        - `customerId`: O ID do cliente que está realizando o pedido.

        - `items`: Uma lista de produtos que compõem o pedido. Para cada item, é preciso
        fornecer o `productId`, a `quantity` e os dados do produto (`name`, `price`,
        `category`).


        **Comportamento:**

        - O sistema calcula o subtotal e o total do pedido.

        - O status inicial do pedido é definido como `RECEIVED`.'
      operationId: post-orders
      requestBody:
        $ref: '#/components/requestBodies/CreateOrderRequest'
      responses:
        '201':
          $ref: '#/components/responses/OrderCreatedResponse'
      servers:
        - url: http://localhost:8080
          description: Localhost
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Order
      summary: Edita o status de um pedido
      description: Edita o status de um pedido.
      operationId: put-orders
      requestBody:
        $ref: '#/components/requestBodies/EditOrderRequest'
      responses:
        '201':
          $ref: '#/components/responses/OrderEditedResponse'
      servers:
        - url: http://localhost:8080
          description: Localhost
tags:
  - name: Order
    description: Operações relacionadas a pedidos
components:
  parameters:
    CpfParam:
      name: cpf
      in: query
      description: CPF do cliente no formato apenas números
      schema:
        type: string
        pattern: ^\d{11}$
    CategoryParam:
      name: category
      in: query
      description: Enum da categoria
      required: false
      schema:
        type: string
        enum:
          - SNACK
          - DRINK
          - DESSERT
          - SIDE_DISH
    SKU:
      name: SKU
      in: query
      description: SKU do produto
      required: false
      schema:
        type: string
    PageParam:
      name: page
      in: query
      description: Número da página (começando em 0)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      description: Tamanho da página (número de itens por página)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  requestBodies:
    CreateOrderRequest:
      description: Requisição para criação de um novo pedido contendo cliente, lista
        completa de itens com todos os dados necessários e observações opcionais.
      content:
        application/json:
          schema:
            type: object
            properties:
              customerId:
                type: string
                description: CPF do cliente (apenas números)
                example: '92558374001'
              items:
                type: array
                minItems: 1
                maxItems: 100
                description: Lista completa de itens do pedido com todos os dados
                  necessários
                items:
                  $ref: '#/components/schemas/OrderItem'
              discounts:
                type: array
                description: Lista de descontos aplicáveis ao pedido
                items:
                  $ref: '#/components/schemas/Discount'
              notes:
                type: array
                description: 'Observações opcionais para o pedido (ex: retirar salada,
                  sem cebola)'
                items:
                  type: string
                  example: Remover a salada
            required:
              - customerId
              - items
          examples:
            PedidoCompleto:
              summary: Pedido completo com múltiplos itens
              description: 'Exemplo de criação de pedido com todos os dados necessários:
                cliente, itens completos com nome, preço, categoria e quantidade'
              value:
                customerId: 241fae7b-0210-4d29-a928-90653c9a9a89
                items:
                  - productId: 441fae7b-0210-4d29-a928-90653c9a9a89
                    name: Big Mac
                    quantity: 2
                    price: 25.9
                    category: SNACK
                    discount:
                      value: 0.0
                  - productId: 551fae7b-0210-4d29-a928-90653c9a9a89
                    name: Coca-Cola 500ml
                    quantity: 1
                    price: 6.5
                    category: DRINK
                    discount:
                      value: 0.0
                discounts:
                  - value: 0.0
                notes:
                  - Sem cebola
            PedidoComDesconto:
              summary: Pedido com desconto aplicado
              description: Exemplo de pedido com desconto aplicado nos itens e no
                total
              value:
                customerId: 241fae7b-0210-4d29-a928-90653c9a9a89
                items:
                  - productId: 441fae7b-0210-4d29-a928-90653c9a9a89
                    name: Big Mac
                    quantity: 1
                    price: 25.9
                    category: SNACK
                    discount:
                      value: 2.5
                discounts:
                  - value: 2.5
                notes:
                  - Promoção aplicada
    EditOrderRequest:
      description: Requisição para edição do status de um pedido.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                description: Status do pedido
                example: 'Done'
            required:
              - status
  responses:
    ErrorResponse:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              error:
                type: array
                items:
                  type: string
    OrderListResponse:
      description: Lista de pedidos ativos ordenados por prioridade e data
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                orderId:
                  $ref: '#/components/schemas/UUID'
                customerId:
                  type: string
                  description: CPF do cliente (apenas números)
                  example: '92558374001'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
                discountAmountTotal:
                  $ref: '#/components/schemas/Money'
                total:
                  $ref: '#/components/schemas/Money'
                status:
                  $ref: '#/components/schemas/OrderStatus'
              required:
                - orderId
                - customerId
                - items
                - discountAmountTotal
                - total
                - status
          examples:
            Example 1:
              value:
                - orderId: 241fae7b-0210-4d29-a928-90653c9a9a89
                  customerId: 321fae7b-0210-4d29-a928-90653c9a9a89
                  items:
                    - productId: 441fae7b-0210-4d29-a928-90653c9a9a89
                      name: Big Mac
                      quantity: 2
                      price: 25.9
                      category: SNACK
                  discountAmountTotal: 0.0
                  subtotal: 51.8
                  total: 51.8
                  status: DONE
    OrderEditedResponse:
      description: Retorno de edição de Pedido
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
    OrderCreatedResponse:
      description: Example response
      content:
        application/json:
          schema:
            type: object
            properties:
              orderId:
                $ref: '#/components/schemas/UUID'
              items:
                type: array
                readOnly: true
                items:
                  $ref: '#/components/schemas/OrderItem'
              discounts:
                type: array
                readOnly: true
                items:
                  type: object
                  properties:
                    type:
                      $ref: '#/components/schemas/DiscountType'
                    amount:
                      $ref: '#/components/schemas/Money'
                    reason:
                      type: string
              discountAmountTotal:
                $ref: '#/components/schemas/Money'
              subtotal:
                $ref: '#/components/schemas/Money'
              total:
                $ref: '#/components/schemas/Money'
              status:
                $ref: '#/components/schemas/OrderStatus'
            required:
              - orderId
              - items
              - discountAmountTotal
              - subtotal
              - total
              - status
          examples:
            Example 1:
              value:
                orderId: 241fae7b-0210-4d29-a928-90653c9a9a89
                items:
                  - productId: 241fae7b-0210-4d29-a928-90653c9a9a89
                    name: string
                    quantity: 2
                    price: 1946.32
                    category: SNACK
                    discount:
                      value: 1946.32
                discounts:
                  - type: PERCENTAGE
                    amount: 1946.32
                    reason: string
                discountAmountTotal: 1946.32
                subtotal: 1946.32
                total: 1946.32
                status: RECEIVED
  schemas:
    ErrorResponse:
      type: object
      title: ErrorResponse
      description: Response de erro
      properties:
        status:
          type: integer
        message:
          type: string
        error:
          type: array
          items:
            type: string
      example:
        status: 400
        message: Requisição inválida
        error:
          - Campo obrigatório 'email' não informado
    UUID:
      type: string
      title: UUID
      description: Identificador único universal no formato UUID.
      format: uuid
      example: 241fae7b-0210-4d29-a928-90653c9a9a89
    Money:
      type: number
      title: Money
      description: Valor monetário representado em formato brasileiro (R$), com suporte
        a casas decimais.
      format: double
      example: 1946.32
    Category:
      type: string
      enum:
        - SNACK
        - DRINK
        - DESSERT
        - SIDE_DISH
      title: Category
      description: Categoria do produto dentro do pedido.
    OrderItem:
      type: object
      title: OrderItem
      description: Item individual de um pedido, contendo todas as informações do
        produto e quantidade solicitada.
      properties:
        productId:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Quantidade solicitada do produto
          example: 2
        discount:
          $ref: '#/components/schemas/Discount'
      required:
        - productId
        - quantity
    Discount:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/Money'
      required:
        - value
    DiscountType:
      type: string
      enum:
        - PERCENTAGE
        - FIXED
      title: DiscountType
      readOnly: true
    OrderStatus:
      type: string
      enum:
        - RECEIVED
        - AWAITING_PAYMENT
        - PAID
        - IN_PREPARATION
        - DONE
        - DELIVERED
      title: OrderStatus
      readOnly: true